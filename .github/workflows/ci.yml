name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, xml, curl, zip
          coverage: none
          tools: composer:v2

      # ── Node ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      # ── Composer ─────────────────────────────────────────
      - name: Install PHP dependencies
        working-directory: portal
        run: composer install --no-progress --prefer-dist

      # ── NPM ──────────────────────────────────────────────
      - name: Install Node dependencies
        working-directory: portal
        run: npm ci

      # ── Environment ──────────────────────────────────────
      - name: Create .env
        working-directory: portal
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          cp .env.example .env
          php artisan key:generate

      # ── Vite Build ───────────────────────────────────────
      - name: Build frontend assets
        working-directory: portal
        run: npm run build

      # ── PHPUnit ──────────────────────────────────────────
      - name: Prepare test database (for AllRolesE2ETest)
        working-directory: portal
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run PHPUnit
        working-directory: portal
        run: php artisan test
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_CUSTOMERS_BOARD_ID: 5029327268
          MONDAY_TICKETS_BOARD_ID: 5029331350
          MONDAY_SERVICE_REPORT_BOARD_ID: 5029041107

      # ── Custom test suites ───────────────────────────────
      - name: TSR form tests (36/36)
        working-directory: portal
        run: php scripts/test_tsr_form.php

      - name: Channel auth checks
        working-directory: portal
        run: echo "skipped — verify_fixes.php was a one-off debug script, not tracked in git"

      # ── Lint ─────────────────────────────────────────────
      - name: PHP syntax check
        working-directory: portal
        run: |
          errors=$(find app -name '*.php' -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "All PHP files pass syntax check"

      # ── Cache verification ───────────────────────────────
      - name: Verify production caches build
        working-directory: portal
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── PHP (for composer install --no-dev) ──────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, xml, curl, zip
          coverage: none
          tools: composer:v2

      # ── Node (for Vite build) ────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      # ── Build ────────────────────────────────────────────
      - name: Install PHP dependencies (production)
        working-directory: portal
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        working-directory: portal
        run: npm ci

      - name: Build frontend assets
        working-directory: portal
        run: npm run build

      # ── Deploy via FTP (cPanel FTP account, root = portal dir) ─
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: portal
          server-dir: /
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**/**/*
            **/node_modules/**
            **/.env*
            **/storage/**
            **/bootstrap/cache/**
            **/tests/**
            **/scripts/**
            **/phpunit.xml
            **/error_log
