name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, xml, curl, zip
          coverage: none
          tools: composer:v2

      # ── Node ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      # ── Composer ─────────────────────────────────────────
      - name: Install PHP dependencies
        working-directory: portal
        run: composer install --no-progress --prefer-dist

      # ── NPM ──────────────────────────────────────────────
      - name: Install Node dependencies
        working-directory: portal
        run: npm ci

      # ── Environment ──────────────────────────────────────
      - name: Create .env
        working-directory: portal
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          cp .env.example .env
          php artisan key:generate

      # ── Vite Build ───────────────────────────────────────
      - name: Build frontend assets
        working-directory: portal
        run: npm run build

      # ── PHPUnit ──────────────────────────────────────────
      - name: Prepare test database (for AllRolesE2ETest)
        working-directory: portal
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run PHPUnit
        working-directory: portal
        run: php artisan test
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_CUSTOMERS_BOARD_ID: 5029327268
          MONDAY_TICKETS_BOARD_ID: 5029331350
          MONDAY_SERVICE_REPORT_BOARD_ID: 5029041107

      # ── Custom test suites ───────────────────────────────
      - name: TSR form tests (36/36)
        working-directory: portal
        run: php scripts/test_tsr_form.php

      - name: Channel auth checks
        working-directory: portal
        run: echo "skipped — verify_fixes.php was a one-off debug script, not tracked in git"

      # ── Lint ─────────────────────────────────────────────
      - name: PHP syntax check
        working-directory: portal
        run: |
          errors=$(find app -name '*.php' -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "All PHP files pass syntax check"

      # ── Cache verification ───────────────────────────────
      - name: Verify production caches build
        working-directory: portal
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── PHP (for composer install --no-dev) ──────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, xml, curl, zip
          coverage: none
          tools: composer:v2

      # ── Node (for Vite build) ────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      # ── Build ────────────────────────────────────────────
      - name: Install PHP dependencies (production)
        working-directory: portal
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        working-directory: portal
        run: npm ci

      - name: Build frontend assets
        working-directory: portal
        run: npm run build

      # ── Deploy via FTP (lftp mirror: uploads only changed files) ─
      - name: Restore source file mtimes from git (for delta upload)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-restore-mtime lftp
          git-restore-mtime portal

      - name: Align vendor mtimes with composer.lock (skips vendor when lock is unchanged)
        run: |
          LOCK_TIME="$(git log -1 --format=%cI -- portal/composer.lock)"
          find portal/vendor -exec touch -d "$LOCK_TIME" {} +

      - name: Deploy changed files to cPanel via FTP
        working-directory: portal
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:passive-mode on; set net:timeout 60; set net:max-retries 2; mirror -R --only-newer --delete --no-perms --no-umask --exclude-glob '.env*' --exclude-glob 'storage' --exclude-glob 'storage/**' --exclude-glob 'node_modules/**' --exclude-glob 'bootstrap/cache/**' --exclude-glob 'tests/**' --exclude-glob 'scripts/**' --exclude-glob 'phpunit.xml' --exclude-glob 'error_log' --exclude-glob 'public/storage/**' . /; bye" "$FTP_SERVER"
